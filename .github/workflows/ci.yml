name: Validate project

on:
  push:
    paths-ignore:
      - 'state/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'state/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
